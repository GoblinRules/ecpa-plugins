[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecpa-mcp-gateway"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "uvicorn==0.54.0", "tomlkit==0.15.0", "portalocker==3.2.0", "json5==0.12.1", "pywin32==312; sys_platform == 'win32'"]

[project.scripts]
ecpa-gateway = "ecpa_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["ecpa_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
