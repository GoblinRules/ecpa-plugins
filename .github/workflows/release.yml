name: Build selected plugin
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin ID, e.g. mcp-manager'
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PLUGIN_ID: ${{ inputs.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - name: Build selected package
        shell: pwsh
        run: python scripts/package.py --plugin $env:PLUGIN_ID
      - uses: actions/upload-artifact@v4
        with:
          name: selected-plugin-windows-amd64
          path: dist/**
