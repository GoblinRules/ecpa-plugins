name: Publish plugin release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Full 40-character commit SHA from GoblinRules/ecpa-plugins'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      PLUGIN_ID: __PLUGIN_ID__
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Require an immutable source revision
        shell: pwsh
        run: |
          if ($env:SOURCE_REF -notmatch '^[0-9a-f]{40}$') { throw 'Use a full commit SHA' }
      - uses: actions/checkout@v4
        with:
          repository: GoblinRules/ecpa-plugins
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build and publish only this plugin
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish.py --plugin $env:PLUGIN_ID --repository $env:GITHUB_REPOSITORY
