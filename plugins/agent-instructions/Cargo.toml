[package]
name = "agent-instructions"
version = "0.6.2"
repository = "https://github.com/GoblinRules/ecpa-agent-instructions"
edition = "2021"
license = "MIT"
description = "Claude and Codex global instruction editor for CLIProxyAPI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-files = { path = "../../crates/agent-files" }
base64 = "0.22"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"

