[package]
name = "ssh-machines"
version = "0.2.1"
repository = "https://github.com/GoblinRules/ecpa-ssh-machines"
edition = "2021"
license = "MIT"
description = "Named SSH machine profiles with pinned host keys and read-only connection diagnostics."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
machine-access = { path = "../../crates/machine-access" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
