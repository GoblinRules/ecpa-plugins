[package]
name = "machine-access"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared pinned-host SSH operations for ECPA machine management and its runtime helper"

[dependencies]
base64 = "0.22"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
